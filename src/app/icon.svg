<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OrderNook app icon — bright glossy green "ON" mark, matches the
       ordernook.uk logo. Full-bleed background for maskable use; glyph
       sits inside the centre-80% safe zone. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63C23A"/>
      <stop offset="0.5" stop-color="#33A00F"/>
      <stop offset="1" stop-color="#1C7D06"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#face)"/>
    <ellipse cx="256" cy="88" rx="290" ry="150" fill="url(#shine)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#0c5200" stroke-width="10"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5"/>
  <text x="256" y="272" text-anchor="middle" dominant-baseline="central"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="248" letter-spacing="-8" fill="#ffffff">ON</text>
</svg>
